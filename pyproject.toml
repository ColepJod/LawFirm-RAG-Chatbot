[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lawfirm-rag"
version = "0.1.0"
description = "Local-first, multi-document RAG chatbot for a law firm, orchestrated with LangGraph."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "PyYAML==6.0.3",
    "structlog==26.1.0",
    "tiktoken==0.14.0",
]

[project.optional-dependencies]
orchestration = [
    "langchain==1.4.7",
    "langgraph==1.2.16",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.3",
]
ingest = [
    "pdfmux[langchain]==1.8.7",
    "docling==2.142.0",
    "unstructured[pdf,docx]==0.27.33",
    "langchain-core==1.6.13",
]
retrieval = [
    "chromadb==1.5.9",
    "langchain-chroma==1.1.0",
    "langchain-qdrant==1.1.0",
    "qdrant-client==1.20.0",
    "rank-bm25==0.2.2",
    "sentence-transformers==3.4.1",
    "langchain-huggingface==1.2.3",
    "tiktoken==0.14.0",
]
generation = [
    "langchain-groq==1.1.3",
    "langchain-ollama==1.1.0",
    "ollama==0.6.3",
]
evaluation = [
    "llamella==0.1.0",
    "ragnarok-ai==1.11.0",
    "ragas==0.4.3",
]
api = [
    "fastapi==0.161.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
]
observability = [
    "langfuse==5.0.4",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "config",
    "evaluation",
    "generation",
    "graph",
    "ingestion",
    "retrieval",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "config",
    "evaluation",
    "generation",
    "graph",
    "ingestion",
    "retrieval",
]
