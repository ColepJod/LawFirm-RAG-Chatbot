<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Law Firm RAG Chatbot</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --user: #2563eb;
      --assistant: #374151;
      --border: #374151;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .app {
      width: min(900px, 100%);
      height: min(800px, 90vh);
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .status {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background: var(--user);
    }
    .assistant {
      align-self: flex-start;
      background: var(--assistant);
      border: 1px solid var(--border);
    }
    .citations {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .composer {
      border-top: 1px solid var(--border);
      padding: 16px;
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.7);
    }
    textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #0b1220;
      color: var(--text);
      font: inherit;
      min-height: 48px;
      max-height: 140px;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      background: var(--accent);
      color: #082f49;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .thread {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
    input.thread-id {
      background: #0b1220;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 8px;
      width: 180px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <div class="title">Law Firm RAG Chatbot</div>
        <div class="subtitle">Ask questions about your ingested documents</div>
      </div>
      <div class="thread">
        Thread ID:
        <input id="threadId" class="thread-id" />
        <span id="status" class="status">Ready</span>
      </div>
    </div>
    <div id="messages" class="messages"></div>
    <div class="composer">
      <textarea id="query" placeholder="Ask a question..."></textarea>
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const queryEl = document.getElementById("query");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const threadEl = document.getElementById("threadId");

    threadEl.value = localStorage.getItem("threadId") || "demo";
    threadEl.addEventListener("change", () => localStorage.setItem("threadId", threadEl.value));

    function addMessage(text, role, citations = []) {
      const div = document.createElement("div");
      div.className = "message " + role;
      div.textContent = text;
      if (citations && citations.length) {
        const cite = document.createElement("div");
        cite.className = "citations";
        cite.textContent = "Sources: " + citations.join(" | ");
        div.appendChild(cite);
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function send() {
      const query = queryEl.value.trim();
      if (!query) return;
      queryEl.value = "";
      addMessage(query, "user");
      sendBtn.disabled = true;
      statusEl.textContent = "Thinking...";
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, thread_id: threadEl.value })
        });
        const data = await response.json();
        if (!response.ok) {
          addMessage("Error: " + (data.detail || response.statusText), "assistant");
        } else {
          addMessage(data.answer || "No answer returned.", "assistant", data.citations || []);
        }
      } catch (err) {
        addMessage("Network error: " + err.message, "assistant");
      } finally {
        sendBtn.disabled = false;
        statusEl.textContent = "Ready";
      }
    }

    sendBtn.addEventListener("click", send);
    queryEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
